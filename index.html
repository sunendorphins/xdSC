<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市信贷产品筛查系统</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f3f6f9;
            padding: 30px;
        }
        .search-box {
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }
        .search-box h2 {
            color: #1967d2;
            margin-bottom: 16px;
            font-size: 20px;
        }
        #cityInput {
            width: 360px;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #d0d7e3;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            height: 42px;
            padding: 0 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-left: 10px;
        }
        #searchBtn {
            background: #1967d2;
            color: #fff;
        }
        #clearBtn {
            background: #94a3b8;
            color: #fff;
        }
        .tip-text {
            margin-top: 12px;
            color: #64748b;
            font-size: 14px;
        }
        .result-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
        }
        .product-card h3 {
            color: #1967d2;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .product-card p {
            line-height: 1.7;
            color: #334155;
            margin: 6px 0;
            font-size: 14px;
        }
        .product-card strong {
            color: #0f172a;
        }
        .empty-tip {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="search-box">
        <h2>城市信贷产品查询</h2>
        <input type="text" id="cityInput" placeholder="请输入城市名称，例如：南京、成都、深圳">
        <button id="searchBtn">查询产品</button>
        <button id="clearBtn">清空</button>
        <div class="tip-text">支持模糊检索，输入省份/城市名即可匹配对应可办理贷款产品</div>
    </div>

    <div class="result-wrap" id="resultBox"></div>

<script>
// 全部信贷产品数据源（完全提取文档内容，包含开放城市、产品详情、准入人群）
const productData = [
    {
        name: "中行-中银E贷",
        openCity: ["全国"],
        age: "18-60周岁",
        maxAmount: "最高30万",
        targetUser: "中行代发工资、中行房贷、公积金缴满6个月、公务员/事业编/央企/国企/上市公司",
        creditRule: "无当前逾期，近两年无连三累六；近3个月少申请网贷信用卡；负债、网贷笔数不宜过高",
        channel: "微信二维码申请"
    },
    {
        name: "农行-网捷贷",
        openCity: ["全国"],
        age: "22-60周岁",
        maxAmount: "最高30万",
        targetUser: "农行代发1年以上、农行按揭房还款满2年、公积金连续缴2年；公务员/事业单位/国企/央企/上市公司；无经营贷",
        creditRule: "信用卡使用率≤70%"
    },
    {
        name: "工行-融E借",
        openCity: ["全国"],
        age: "23-60周岁",
        maxAmount: "最高30万，总负债不超500万",
        targetUser: "公务员/事业编/国企/央企/上市公司；优质单位公积金基数4000+缴满半年；私企基数6000+缴满1年",
        creditRule: "2个月查询≤6次，3个月≤10次，半年≤15次"
    },
    {
        name: "建行-快贷/建易贷",
        openCity: ["全国"],
        age: "22-60周岁",
        maxAmount: "快贷额度30万；建易贷最高100万，最长5年",
        targetUser: "建行代发、公积金客户；建易贷支持线下申请",
        creditRule: "信用卡不超6家，近半年查询≤10次；还款方式：先息后本/等额本息"
    },
    {
        name: "南银法巴",
        openCity: ["北京","上海","天津","重庆","福州","泉州","厦门","石家庄","保定","日照","青岛","济南","临沂","潍坊","烟台","枣庄","威海","聊城","郑州","广州","深圳","太原","贵阳","西安","南京","无锡","苏州","南通","泰州","扬州","常州","徐州","盐城","镇江","连云港","宿迁","淮安","杭州","宁波","绍兴","温州","台州","金华","嘉兴","武汉","合肥","滁州","芜湖","成都","南宁","长沙","海口"],
        age: "",
        maxAmount: "",
        targetUser: "仅限上述开放城市客户",
        creditRule: ""
    },
    {
        name: "兴业消费金融",
        openCity: ["合肥","芜湖","安庆","滁州","宿州","阜阳","亳州","马鞍山","南京","无锡","徐州","常州","苏州","南通","杭州","宁波","金华","嘉兴","绍兴","福州","三明","泉州","漳州","宁德","济南","青岛","临沂","郑州","武汉","长沙","株洲","湘潭","广州","深圳","佛山","东莞","中山","珠海","梅州","江门","顺德","汕头","重庆","成都","资阳","绵阳","宜宾","眉山","德阳","西安","太原","大连","石家庄","天津","上海"],
        age: "",
        maxAmount: "",
        targetUser: "安徽/江苏/浙江/福建/山东/河南/湖北/湖南/广东/重庆/四川/陕西/山西/辽宁/河北/天津/上海区域客户",
        creditRule: ""
    },
    {
        name: "新网银行",
        openCity: ["全国"],
        age: "",
        maxAmount: "",
        targetUser: "满足其一：公积金缴满3个月基数≥2000/个税缴满9个月；按揭房还款1个月/车贷3个月；1年以上信贷记录；公务员/国企/大专学历；社保缴满3个月",
        creditRule: "近1月审批查询≤10，3月≤15；当日查询≤6；信用卡使用率＜80%；信用负债≤200万；提款有电话回访"
    },
    {
        name: "中银消费金融",
        openCity: ["北京","上海","广州","深圳","重庆","天津","南京","苏州","无锡","常州","南通","杭州","宁波","温州","绍兴","佛山","东莞","珠海","济南","青岛","福州","厦门","泉州","武汉","长沙","成都","合肥","西安","郑州"],
        age: "20-55周岁，非在校、非离退休",
        maxAmount: "单人最高20万，夫妻双签最高40万，最长5年",
        targetUser: "社保公积金缴6-12个月；按揭房还款半年；商业保单缴满3年；大专学历+打卡工资",
        creditRule: "无当前逾期，无M3；近1月查询≤4，2月≤7，3月≤9；月负债不超收入70%-75%"
    },
    {
        name: "中邮消费金融-邮你贷",
        openCity: ["全国"],
        banArea: ["新疆","西藏","青海","宁夏县域审批严格"],
        age: "18-60周岁，偏好22-55岁，非在校、离退休",
        maxAmount: "最高20万，最长3年，循环贷随借随还无违约金",

        age: "20-55岁",
        maxAmount: "最高30万，最长3年，可先息后本，提前还款无违约金",
        targetUser: "公务员/教师/医生/上市公司；社保公积金缴满1年；名下按揭房；加分：本科、优质单位、房贷车贷",
        creditRule: "年化3.98%-19.8%"
    },
    {
        name: "邮储银行-邮享贷",
        openCity: ["全国"],
        age: "",
        maxAmount: "线上最高30万，最长7年，支持先息后本",
        targetUser: "社保/公积金/个税缴满6个月；邮储存量按揭/理财/信用卡客户",
        creditRule: "近2月查询≤5，半年≤12；无当前逾期；信用卡使用率≤80%；信贷机构≤4家，总负债≤80万"
    },
    {
        name: "交通银行-惠民贷/学历贷",
        openCity: ["全国"],
        age: "学历贷31周岁以内；惠民贷无特殊年龄限制",
        maxAmount: "最高100万，最长7年，先息后本/等额本息",
        targetUser: "交行信用卡/代发/按揭房/按揭车/公积金/社保；学历贷：全日制本科以上，有无工作均可",
        creditRule: "非白户，信贷笔数＜5；近2月查询＜6；无当前逾期；2年无90天逾期"
    }
];

// 渲染产品列表
function renderResult(list, keyword) {
    let html = "";
    if(list.length === 0) {
        html = `<div class="empty-tip">未找到【${keyword}】可办理的信贷产品，请更换城市重新查询</div>`;
    } else {
        $.each(list, function(i, item) {
            html += `
            <div class="product-card">
                <h3>${item.name}</h3>
                ${item.age ? `<p><strong>适用年龄：</strong>${item.age}</p>` : ''}
                ${item.maxAmount ? `<p><strong>额度期限：</strong>${item.maxAmount}</p>` : ''}
                <p><strong>可办理城市：</strong>${item.openCity.join('、')}</p>
                ${item.banArea ? `<p><strong>风控禁入区域：</strong>${item.banArea.join('、')}</p>` : ''}
                <p><strong>准入人群：</strong>${item.targetUser}</p>
                ${item.creditRule ? `<p><strong>征信&风控要求：</strong>${item.creditRule}</p>` : ''}
            </div>
            `
        })
    }
    $("#resultBox").html(html);
}

// 检索匹配逻辑
function searchProduct() {
    let cityKey = $("#cityInput").val().trim();
    if(!cityKey) {
        alert("请输入城市名称再查询");
        return;
    }
    cityKey = cityKey.toLowerCase();
    // 筛选包含该城市的产品
    let filterArr = $.grep(productData, function(item) {
        // 全国产品全部匹配
        if(item.openCity.includes("全国")) return true;
        // 匹配开放城市内包含输入关键词
        let match = false;
        $.each(item.openCity, function(idx, city) {
            if(city.toLowerCase().indexOf(cityKey) > -1) {
                match = true;
                return false;
            }
        })
        return match;
    })
    renderResult(filterArr, cityKey);
}

// 清空
function clearAll() {
    $("#cityInput").val("");
    $("#resultBox").html(`<div class="empty-tip">输入城市名称，点击查询查看对应贷款产品</div>`);
}

// 绑定事件
$("#searchBtn").click(searchProduct);
$("#clearBtn").click(clearAll);
$("#cityInput").keydown(function(e) {
    if(e.keyCode === 13) searchProduct();
})

// 页面初始化默认提示
clearAll();
</script>
</body>
</html>
